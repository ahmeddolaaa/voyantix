<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Voyantix — End Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #14181c;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 40px;
    flex-wrap: wrap;
    padding: 40px;
    font-family: "IBM Plex Mono", monospace;
  }

  /* Each card is an exact export frame. Screenshot the card itself,
     not the page, so you get clean edges at the right aspect ratio. */
  .card {
    background: #0E3438;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .square { width: 540px; height: 540px; }     /* 1:1  — export 1080×1080 */
  .vertical { width: 432px; height: 540px; }   /* 4:5  — export 1080×1350 */

  .mark { margin-bottom: 22px; }
  .word {
    font-family: "Fraunces", serif;
    font-weight: 400;
    color: #F3F7F9;
    letter-spacing: 0.5px;
  }
  .square .word { font-size: 46px; }
  .vertical .word { font-size: 40px; }

  .rule {
    width: 46px;
    height: 1px;
    background: rgba(230,160,90,.5);
    margin: 20px 0 18px;
  }

  .sub {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    letter-spacing: 2.6px;
    color: #8FAEC0;
    text-transform: uppercase;
  }
  .vertical .sub { font-size: 11.5px; letter-spacing: 2.2px; }

  .label {
    width: 100%;
    text-align: center;
    color: #71868D;
    font-size: 12px;
    letter-spacing: 1px;
    margin-top: 12px;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>

  <div class="wrap">
    <div class="card square">
      <svg class="mark" width="52" height="52" viewBox="0 0 24 24" fill="none" style="color:#E6A05A">
        <path d="M3 18C7 18 6 8 11 8C15 8 14 15 19 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="19" cy="15" r="2" fill="currentColor"/>
      </svg>
      <div class="word">Voyantix</div>
      <div class="rule"></div>
      <div class="sub">Laytime · Demurrage · Despatch</div>
    </div>
    <div class="label">1:1 — export at 1080 × 1080</div>
  </div>

  <div class="wrap">
    <div class="card vertical">
      <svg class="mark" width="46" height="46" viewBox="0 0 24 24" fill="none" style="color:#E6A05A">
        <path d="M3 18C7 18 6 8 11 8C15 8 14 15 19 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="19" cy="15" r="2" fill="currentColor"/>
      </svg>
      <div class="word">Voyantix</div>
      <div class="rule"></div>
      <div class="sub">Laytime · Demurrage</div>
    </div>
    <div class="label">4:5 — export at 1080 × 1350</div>
  </div>

</body>
</html>
